    <script src="script.js"></script>

<body>

            </optgroup>

            <optgroup label="Barcelona" id="bar">

                <option value="Lewandowski">Lewandowski</option>
                <option value="Pedri">Pedri</option>
                <option value="Balde">Balde</option>

            </optgroup>

            <optgroup label="Getafe" id="get">

                <option value="Nyom">Nyom</option>
                <option value="Djene">Djene</option>
                <option value="Mayoral">Mayoral</option>

            </optgroup>

        </select>

    </form>


</body>

</html>
