<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PRÁCTICA_2_UT05 - Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Formulario de Registro</h1>
    </header>
    <nav>
        <a href="index.html">Volver a Inicio</a>
    </nav>
    
    <form id="registro-form" name="registro-form">
        <input type="hidden" id="token" name="token">
        
        <div class="form-group">
            <label for="nombre">Nombre (*)</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="form-group">
            <label for="apellidos">Apellidos (*)</label>
            <input type="text" id="apellidos" name="apellidos" required>
        </div>

        <div class="form-group">
            <label for="email">Email (*)</label>
            <input type="text" id="email" name="email" required placeholder="ejemplo@dominio.com">
        </div>

        <div class="form-group">
            <label for="password">Contraseña (*)</label>
            <input type="password" id="password" name="password" required 
                   placeholder="Mín. 8 chars, Mayús, Minús, Número">
        </div>
        <div class="form-group">
            <label for="repeat-password">Repetir Contraseña (*)</label>
            <input type="password" id="repeat-password" name="repeat-password" required>
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono (*)</label>
            <input type="text" id="telefono" name="telefono" required maxlength="9" placeholder="9 dígitos numéricos">
        </div>

        <div class="form-group">
            <label for="matricula">Matrícula (Opcional)</label>
            <input type="text" id="matricula" name="matricula" placeholder="Ej: 1234 ABC">
        </div>

        <div class="form-group">
            <label for="provincia">Provincia (*)</label>
            <select id="provincia" name="provincia" required>
                <option value="" selected disabled>Selecciona una provincia</option>
                <option value="madrid">Madrid</option>
                <option value="barcelona">Barcelona</option>
                <option value="valencia">Valencia</option>
                <option value="sevilla">Sevilla</option>
            </select>
        </div>

        <div class="form-group">
            <label>Turno Elegido</label>
            <label><input type="radio" name="turno" value="manana" checked> Mañana</label>
            <label><input type="radio" name="turno" value="tarde"> Tarde</label>
            <label><input type="radio" name="turno" value="online"> Online</label>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="condiciones" name="condiciones" required> 
                Acepto las condiciones de registro (*)
            </label>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="newsletter" name="newsletter"> 
                Deseo recibir la Newsletter
            </label><br>
            <label>
                <input type="checkbox" id="recordar-preferencias" name="recordar-preferencias"> 
                Recordar Provincia y Turno (Cookies)
            </label>
        </div>

        <div class="form-group">
            <label for="observaciones">Observaciones</label>
            <textarea id="observaciones" name="observaciones"></textarea>
        </div>
        
        <hr>

        <button type="submit">Enviar Registro</button>
        <button type="reset">Limpiar Formulario (Reset)</button>
        <button type="button" id="btn-validar">Validación Manual</button>
    </form>

    <h2>Demostración de Eventos (Captura, Burbujeo, stopPropagation)</h2>
    <div id="bubble-container">
        Contenedor (Padre): Eventos de **Captura** y **Burbujeo**.<br><br>
        <label>
            <input type="checkbox" id="stop-propagation-check">
            Activar stopPropagation() en el botón
        </label><br><br>
        <button id="bubble-button">Botón (Target)</button>
    </div>
    
    <h3>Orden de Ejecución (Log)</h3>
    <div id="event-log"></div>

    <script src="js/cookies.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/eventos.js"></script>
</body>
</html>
